<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id == null ? 'Nuevo producto' : 'Editar producto'}">Formulario Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4" style="max-width: 750px;">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="fw-bold mb-3" th:text="${product.id == null ? 'Nuevo producto' : 'Editar producto'}"></h4>

            <!-- Un solo formulario para crear y editar vinculado mediante th:object y th:field -->
            <form th:action="@{/product/save}" th:object="${product}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label mb-1">Nombre</label>
                    <input type="text" class="form-control form-control-sm" style="max-width: 280px;"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label mb-1">Precio</label>
                    <input type="text" class="form-control form-control-sm" style="max-width: 280px;"
                           th:field="*{price}"
                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label mb-1">Stock disponible</label>
                    <input type="text" class="form-control form-control-sm" style="max-width: 280px;"
                           th:field="*{stock}"
                           th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid' : ''" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                </div>

                <button type="submit" class="btn btn-light btn-sm border mt-1">Guardar</button>
                <a th:href="@{/product}" class="btn btn-link btn-sm text-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</body>
</html>
