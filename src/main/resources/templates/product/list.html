<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4" style="max-width: 850px;">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="fw-bold mb-2">Catálogo de Productos</h4>

            <div th:if="${msg}" class="alert alert-success py-2" th:text="${msg}"></div>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <div class="mb-3">
                <a th:href="@{/product/new}" class="text-primary text-decoration-underline">Nuevo producto</a>
            </div>

            <table class="table table-sm align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock disponible</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${listaProductos}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.price}"></td>
                        <td th:text="${p.stock}"></td>
                        <td>
                            <a th:href="@{/product/edit(id=${p.id})}" class="me-2">Editar</a>
                            <a th:href="@{/product/delete(id=${p.id})}" class="btn btn-light btn-sm border">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
