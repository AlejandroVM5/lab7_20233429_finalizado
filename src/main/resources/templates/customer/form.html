<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${customer.id == null ? 'Nuevo cliente' : 'Editar cliente'}">Formulario Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4" style="max-width: 750px;">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="fw-bold mb-3" th:text="${customer.id == null ? 'Nuevo cliente' : 'Editar cliente'}"></h4>

            <!-- Unica vista de formulario vinculada con th:object y th:field -->
            <form th:action="@{/customer/save}" th:object="${customer}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label mb-1">Nombre completo</label>
                    <input type="text" class="form-control form-control-sm" style="max-width: 280px;"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label mb-1">Tipo de documento</label>
                    <select class="form-select form-select-sm" style="max-width: 150px;"
                            th:field="*{documentType}"
                            th:classappend="${#fields.hasErrors('documentType')} ? 'is-invalid' : ''">
                        <option value="DNI">DNI</option>
                        <option value="RUC">RUC</option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('documentType')}" th:errors="*{documentType}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label mb-1">Número de documento</label>
                    <input type="text" class="form-control form-control-sm" style="max-width: 280px;"
                           th:field="*{document}"
                           th:classappend="${#fields.hasErrors('document')} ? 'is-invalid' : ''" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('document')}" th:errors="*{document}"></div>
                </div>

                <button type="submit" class="btn btn-light btn-sm border mt-1">Guardar</button>
                <a th:href="@{/customer}" class="btn btn-link btn-sm text-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</body>
</html>
