<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4" style="max-width: 800px;">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="fw-bold mb-3">Registrar Pedido</h4>

            <form th:action="@{/invoice/save}" th:object="${invoice}" method="post">

                <!-- Mensajes globales para reglas que dependen de varios campos (ej: incompatibilidad Factura/Boleta con RUC/DNI, stock, etc.) -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>

                <!-- 1. Tipo de comprobante (Boleta o Factura) -->
                <div class="mb-3">
                    <label class="form-label mb-1">Tipo de comprobante</label>
                    <select class="form-select form-select-sm" style="max-width: 160px;"
                            th:field="*{type}"
                            th:classappend="${#fields.hasErrors('type')} ? 'is-invalid' : ''">
                        <option value="BOLETA">Boleta</option>
                        <option value="FACTURA">Factura</option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>

                <!-- 2. Fecha del pedido (Obligatoria y no futura) -->
                <div class="mb-3">
                    <label class="form-label mb-1">Fecha</label>
                    <input type="date" class="form-control form-control-sm" style="max-width: 180px;"
                           th:field="*{date}"
                           th:classappend="${#fields.hasErrors('date')} ? 'is-invalid' : ''" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                </div>

                <!-- 3. Seleccion de Cliente (se conserva automaticamente gracias a th:field="*{customer.id}") -->
                <div class="mb-3">
                    <label class="form-label mb-1">Cliente</label>
                    <select class="form-select form-select-sm" style="max-width: 320px;"
                            th:field="*{customer.id}"
                            th:classappend="${#fields.hasErrors('customer')} ? 'is-invalid' : ''">
                        <option value="">-- Seleccione un cliente --</option>
                        <option th:each="c : ${listaClientes}"
                                th:value="${c.id}"
                                th:text="|${c.name} - ${c.documentType}: ${c.document}|">
                        </option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div>
                </div>

                <!-- 4. Seleccion de Productos y Cantidades -->
                <h6 class="fw-bold mt-4 mb-2">Productos y cantidades solicitadas</h6>
                <table class="table table-sm align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio unitario</th>
                            <th>Stock disponible</th>
                            <th>Cantidad solicitada</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p, stat : ${listaProductos}">
                            <td th:text="${p.name}"></td>
                            <td th:text="${p.price}"></td>
                            <td th:text="${p.stock}"></td>
                            <td style="width: 160px;">
                                <input type="hidden" name="productIds" th:value="${p.id}" />
                                <input type="text" name="quantities" class="form-control form-control-sm"
                                       th:value="${cantidades != null and stat.index < cantidades.size() ? cantidades[stat.index] : '0'}" />
                            </td>
                        </tr>
                    </tbody>
                </table>

                <button type="submit" class="btn btn-light btn-sm border mt-2">Emitir pedido</button>
                <a th:href="@{/invoice}" class="btn btn-link btn-sm text-secondary mt-2">Cancelar</a>
            </form>
        </div>
    </div>

</body>
</html>
