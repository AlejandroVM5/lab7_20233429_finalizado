<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4" style="max-width: 850px;">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="fw-bold mb-2">Pedidos</h4>

            <div th:if="${msg}" class="alert alert-success py-2" th:text="${msg}"></div>

            <div class="mb-3">
                <a th:href="@{/invoice/new}" class="text-primary text-decoration-underline">Nuevo pedido</a>
            </div>

            <table class="table table-sm align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inv : ${listaPedidos}">
                        <td th:text="${inv.id}"></td>
                        <td th:text="${inv.type}"></td>
                        <td th:text="${inv.date}"></td>
                        <td th:text="|${inv.customer.name} (${inv.customer.documentType}: ${inv.customer.document})|"></td>
                        <td th:text="${inv.total}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
